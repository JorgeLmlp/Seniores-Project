name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'Seniores/front-end/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Seniores/front-end
    env:
      API_URL: https://seniores-project-tj1t.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build APK
        run: |
          echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError' >> android/gradle.properties
          echo 'org.gradle.workers.max=2' >> android/gradle.properties
          flutter build apk --release --no-pub --build-number="$GITHUB_RUN_NUMBER" --dart-define="API_URL=$API_URL"
          cp build/app/outputs/flutter-apk/app-release.apk seniores-android.apk
          sha256sum seniores-android.apk > SHA256SUMS.txt
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: seniores-android
          path: |
            Seniores/front-end/seniores-android.apk
            Seniores/front-end/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="android-build-$GITHUB_RUN_NUMBER"
          cat > release-notes.md <<EOF
          Baixe **seniores-android.apk** nos arquivos abaixo e instale no Android.

          API: $API_URL
          Código: $GITHUB_SHA

          APK para testes, assinado com a chave de desenvolvimento do runner. Uma próxima build pode exigir desinstalar a anterior antes de instalar.
          O arquivo SHA256SUMS.txt permite conferir a integridade do download.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" seniores-android.apk SHA256SUMS.txt --clobber
          else
            gh release create "$tag" seniores-android.apk SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "Seniores Android — build $GITHUB_RUN_NUMBER" \
              --notes-file release-notes.md --latest
          fi
